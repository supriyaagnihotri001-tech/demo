<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login form</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="form-container">
        <h2>Registration Form</h2>
        <form>
            <div class="form-row">
            <label for="first-name">First Name :-</label>
            <input id="first-name" type="text" placeholder="enter your firstname..">
            </div>
            <div class="form-row">
            <label for="last-name">Last Name :-</label>
            <input id="last-name" type="text" placeholder="enter your Lastname..">
            </div>
           <div class="form-row">
            <label for="contact-number">Contact No :-</label>
            <input id="contact-number" type="tel" placeholder="enter your contact No">
            </div>
            <div class="form-row">
            <label for="email">Email ID :-</label>
            <input id="email" type="email" placeholder="enter your email">
            </div>
            <div class="form-row">
            <label for="password">Password :-</label>
            <input id="password" type="password" placeholder="enter your password">
            </div>
            <button type="submit">Register Now </button>
        </form>
    </div>
</body>

</html>
